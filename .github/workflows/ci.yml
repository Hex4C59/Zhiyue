name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/downloader/requirements.txt

      - name: Verify manifest versions
        shell: pwsh
        run: |
          $config = Get-Content app/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $webPackage = Get-Content app/web/package.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ([string]$package.version -ne $version) {
            throw "package.json 版本 $($package.version) 与 tauri.conf.json 版本 $version 不一致。"
          }
          if ([string]$webPackage.version -ne $version) {
            throw "app/web/package.json 版本 $($webPackage.version) 与 tauri.conf.json 版本 $version 不一致。"
          }

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --only-binary=:all: -r app/downloader/requirements.txt

      - name: Type check
        run: npm run typecheck

      - name: Run web and server tests
        run: npm test

      - name: Run downloader tests
        run: npm run test:downloads
