<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zhiyue</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #e8e8e6;
    color: #202224;
    font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  main { width: min(440px, calc(100vw - 64px)); text-align: center; }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 650; }
  p { margin: 0; color: #4d5053; font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
  .spinner {
    width: 14px;
    height: 14px;
    margin: 15px auto 0;
    border: 2px solid #b4b7b7;
    border-top-color: #354f63;
    border-radius: 50%;
    animation: turn .9s linear infinite;
  }
  body.error h1 { color: #902f2b; }
  body.error .spinner { display: none; }
  @keyframes turn { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>Zhiyue</h1>
  <p id="status" role="status">正在启动本地服务…</p>
  <div class="spinner" aria-hidden="true"></div>
</main>
<script>
  window.showStartupError = (message) => {
    document.body.classList.add('error');
    document.getElementById('status').textContent = message;
  };
  // 握手后服务意外退出时由桌面壳复用同一启动页显示原因。
  window.showRuntimeError = window.showStartupError;
</script>
</body>
</html>
