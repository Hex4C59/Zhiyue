<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zhiyue 更新</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f7f4ed; color: #24302c;
      font: 13px/1.7 "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    main { width: 100%; padding: 26px 30px; }
    .mark {
      width: 28px; height: 28px; display: grid; place-items: center; margin-bottom: 12px;
      border-radius: 6px; background: #1f6f5c; color: #fff; font-weight: 700;
    }
    h1 { margin: 0 0 5px; font-size: 16px; font-weight: 600; letter-spacing: .02em; }
    #status { margin: 0 0 16px; color: #52605b; }
    .track {
      height: 5px; overflow: hidden; border-radius: 99px; background: #e4e0d7;
    }
    #bar {
      width: 0; height: 100%; border-radius: inherit; background: #1f6f5c;
      transition: width .2s ease;
    }
    #bar.indeterminate {
      width: 35%; animation: slide 1.2s ease-in-out infinite;
    }
    #hint { margin: 13px 0 0; color: #8a928c; font-size: 11px; line-height: 1.65; }
    #detail { margin-top: 12px; color: #8c3a2b; font-size: 11px; overflow-wrap: anywhere; }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">Z</div>
    <h1>Zhiyue 更新</h1>
    <p id="status">正在下载更新…</p>
    <div class="track"><div id="bar" class="indeterminate"></div></div>
    <p id="hint">下载完成后，Zhiyue 会退出并启动安装程序。</p>
    <p id="detail"></p>
  </main>
  <script>
    window.setUpdateProgress = (percent, message) => {
      const bar = document.getElementById('bar');
      const status = document.getElementById('status');
      const known = typeof percent === 'number' && percent >= 0;
      if (typeof message === 'string' && message) {
        // 百分比直接在文案里可见，避免只能靠细进度条目测。
        status.textContent = known && percent < 100 ? `${message} ${percent}%` : message;
      }
      if (known) {
        bar.classList.remove('indeterminate');
        bar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
      } else {
        bar.classList.add('indeterminate');
      }
    };
    window.setUpdateError = (message) => {
      document.getElementById('status').textContent = '更新失败';
      document.getElementById('hint').textContent = '请关闭本窗口，回到 Zhiyue 后重试。';
      document.getElementById('detail').textContent = message || '';
      document.getElementById('bar').style.display = 'none';
    };
  </script>
</body>
</html>
