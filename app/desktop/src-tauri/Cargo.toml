[package]
name = "zhiyue-desktop"
version = "0.1.0"
description = "Zhiyue 桌面应用"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zhiyue_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
